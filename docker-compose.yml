services:
  cassandra:
    image: cassandra:5
    container_name: travel-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: travel-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
    volumes:
      - cassandra_data:/var/lib/cassandra
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -E '^UN' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  redis:
    image: redis:7-alpine
    container_name: travel-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-app
    restart: unless-stopped
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      CASSANDRA_HOST: cassandra
      CASSANDRA_DC: datacenter1
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
    ports:
      - "3000:3000"
    depends_on:
      cassandra:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  cassandra_data:
  redis_data:
